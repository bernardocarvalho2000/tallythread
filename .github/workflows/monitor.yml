name: Daily uptime check
on:
  schedule: [{ cron: "17 7 * * *" }]  # 07:17 UTC daily; a failure makes GitHub email the owner
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sales stay private: this public repo's logs only show uptime. Sales are in the Gumroad dashboard/emails.
      - run: python ops/monitor.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}
